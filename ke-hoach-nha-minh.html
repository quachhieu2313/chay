<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kế hoạch nhà mình</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday: a shared family planner for two people, calm and practical
   IDEA a week planner on the fridge with two coloured lanes, one per person
   PICTURE today's two lanes side by side: each person's workout and habits
   COLOUR white ground, ink, Hiếu in track red, vợ in pool teal, sport chips in their own colours
   TYPE Barlow Condensed 700 + Be Vietnam Pro
   LAYOUT title and tabs on top; two lanes side by side, stacked on phone; week grids below */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121316);--ink:light-dark(#16171b,#eceef2);--mut:light-dark(#5b5f67,#a3a8b0);--line:light-dark(#e2e3e6,#2c2e34);--pan:light-dark(#f4f4f5,#1b1d22);--p1:light-dark(#c63f1f,#e5603f);--p2:light-dark(#0b7285,#30b6cc)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,sans-serif;overflow-x:clip}
.in{max-width:1180px;margin:0 auto;padding-left:max(5vw,16px);padding-right:max(5vw,16px)}
h1,h2,h3,h4,.cd b,.gd b,.sm b{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
.top{border-bottom:1px solid var(--line)}
.top .in{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-top:24px}
h1{font-size:clamp(36px,6vw,50px);line-height:1.05;letter-spacing:-.01em;margin:0}
.who{margin:4px 0 0;color:var(--mut);font-size:15px;min-height:1.5em}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:-1px}
.tabs a{flex:none;padding:12px 14px;min-height:44px;color:var(--mut);text-decoration:none;font-weight:600;font-size:15px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current=page]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs a:focus-visible{outline:3px solid var(--p2);outline-offset:-3px}
.lanes{display:grid;grid-template-columns:1fr 1fr;height:6px}
.lanes i:first-child{background:var(--p1)}
.lanes i:last-child{background:var(--p2)}
main{padding-top:28px;padding-bottom:56px}
.load,.none{color:var(--mut)}
.none{font-size:15px;margin:4px 0}
.warn{background:color-mix(in srgb,#ee8716 18%,var(--bg));border-radius:12px;padding:12px 16px;margin:0 0 16px}
.kick{margin:0;color:var(--mut);font-weight:500}
h2{font-size:clamp(32px,4.6vw,44px);line-height:1.05;margin:0 0 18px}
h3{font-size:26px;line-height:1.1;margin:0}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);font:600 15px "Be Vietnam Pro",sans-serif;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.btn.on{background:var(--sc,var(--ink));border-color:var(--sc,var(--ink));color:#fff}
.btn.danger{color:#c62828}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.ev:focus-visible{outline:3px solid var(--p2);outline-offset:2px}
.pdot{width:12px;height:12px;border-radius:50%;background:var(--pc);flex:none;display:inline-block}
.l-hieu{--pc:var(--p1)}
.l-vo{--pc:var(--p2)}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.lane{border-top:6px solid var(--pc);background:var(--pan);border-radius:4px 4px 16px 16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.lane>header{display:flex;align-items:center;gap:10px}
.lane h3 small{font-family:"Be Vietnam Pro",sans-serif;font-size:14px;color:var(--mut);font-weight:500}
.wo{background:var(--bg);border-radius:12px;padding:12px 14px;border-left:5px solid var(--sc);display:grid;gap:6px}
.wo.done{opacity:.72}
.wo.done h4{text-decoration:line-through;text-decoration-thickness:2px}
.wt{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;color:#fff;background:var(--sc,var(--mut));white-space:nowrap}
.chip.pc{background:var(--pc)}
.chip.both{background:var(--ink);color:var(--bg)}
.meta{font-size:13px;color:var(--mut);white-space:nowrap}
.wo h4{font-size:22px;line-height:1.1;margin:0}
.det{margin:0;font-size:15px;white-space:pre-line}
details.det summary{cursor:pointer;color:var(--mut);font-size:14px}
.lnk{font-size:14px;color:var(--p1);font-weight:600}
.wa{display:flex;flex-wrap:wrap;gap:8px}
.habs{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:6px}
.habs h5{margin:0;font-size:15px;display:flex;justify-content:space-between}
.habs h5 span{color:var(--mut);font-weight:500}
.hb{display:flex;align-items:center;gap:10px;min-height:40px;font-size:15px}
.hb input{width:22px;height:22px;accent-color:var(--pc);flex:none}
.mc{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-bottom:4px}
.mc label{display:grid;gap:2px;font-size:13px;color:var(--mut)}
.vd{grid-column:1/-1;margin:0;padding:8px 12px;border-radius:10px;font-size:14px;font-weight:600}
.vd.ok{background:color-mix(in srgb,#26a454 18%,var(--bg))}
.vd.no{background:color-mix(in srgb,#dc2f29 18%,var(--bg))}
.vd.na{background:var(--bg);color:var(--mut);font-weight:500}
input,select,textarea{font:16px "Be Vietnam Pro",sans-serif;min-height:44px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:110px;resize:vertical}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:28px}
.box h3{font-size:24px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.box .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.box .row .tm{font-weight:600;white-space:nowrap}
.box .row .tt{flex:1}
.wk{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
.wk h2{margin:0 6px;white-space:nowrap}
.tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border:1.5px solid var(--line);border-radius:14px}
.seg button{min-height:40px;padding:0 14px;border:0;border-radius:10px;background:transparent;color:var(--ink);font:600 15px "Be Vietnam Pro",sans-serif;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.sums{display:flex;flex-wrap:wrap;gap:10px 28px;margin-bottom:16px}
.sm{display:flex;align-items:center;gap:8px;font-size:15px}
.sm b{font-size:20px}
.wgrid{display:grid;gap:8px}
.wgrid.c2{grid-template-columns:84px minmax(0,1fr) minmax(0,1fr)}
.wgrid.c1{grid-template-columns:84px minmax(0,1fr)}
.gh{display:flex;align-items:center;gap:8px;font-weight:700;padding:4px 0}
.gd{padding:10px 0;border-top:2px solid var(--line);display:grid;align-content:start}
.gd b{font-size:24px;line-height:1}
.gd span{color:var(--mut);font-size:14px}
.gd.today b{color:var(--p1)}
.gc{border-top:2px solid var(--pc);background:var(--pan);border-radius:0 0 12px 12px;padding:8px;display:grid;gap:8px;align-content:start}
.gc .wo{padding:10px 12px}
.gc .wo h4{font-size:19px}
.mlab{display:none;font-size:13px;font-weight:600;color:var(--pc)}
.crow{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.cd b{font-size:22px;display:block;line-height:1.1}
.cd span{color:var(--mut);font-size:14px}
.crow.today .cd b{color:var(--p1)}
.cl{display:grid;gap:8px}
.ev{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;width:100%;text-align:left;background:var(--pan);border:0;border-radius:10px;padding:10px 12px;color:var(--ink);font:inherit;cursor:pointer;min-height:44px}
.ev .tm{font-weight:600;white-space:nowrap}
.ev .tt{flex:1}
.ch{display:flex;align-items:center;gap:10px;min-height:44px;background:var(--pan);border-radius:10px;padding:6px 12px}
.ch input{width:22px;height:22px;flex:none;accent-color:var(--ink)}
.ch .tt{flex:1}
.ch.done .tt{text-decoration:line-through;color:var(--mut)}
.mrow{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.mi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.f{display:grid;gap:4px;font-size:14px;color:var(--mut)}
.note{color:var(--mut);font-size:15px;max-width:72ch;margin:16px 0 0}
.claim{background:color-mix(in srgb,var(--p2) 12%,var(--bg));border-radius:16px;padding:20px;margin-bottom:24px;display:grid;gap:12px;max-width:620px}
.claim p{margin:0}
.list{display:grid;gap:8px;margin-top:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;z-index:10}
.modal[hidden]{display:none}
.sheet{background:var(--bg);border-radius:18px;padding:20px;width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto}
.sheet h3{margin-bottom:14px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg2 .wide{grid-column:1/-1}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days label{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1.5px solid var(--line);border-radius:10px;color:var(--ink);min-height:40px}
.days input{width:18px;height:18px;min-height:0}
.mb{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;align-items:center}
.mb .sp{flex:1}
.who a,.who button{color:var(--ink);font:inherit;font-weight:600;background:none;border:0;padding:0 0 0 8px;cursor:pointer;text-decoration:underline}
.home{font-size:14px;color:var(--mut);text-decoration:none;font-weight:600}
.home:hover{color:var(--ink)}
.foot{border-top:1px solid var(--line);padding-top:20px;padding-bottom:40px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--mut);font-size:14px}
.foot[hidden]{display:none}
.foot .sp{flex:1}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
@media(max-width:900px){.tri{grid-template-columns:1fr}}
@media(max-width:720px){.duo{grid-template-columns:1fr}.wgrid.c2,.wgrid.c1{grid-template-columns:1fr}.gh{display:none}.gd{display:flex;align-items:baseline;gap:10px;padding-top:16px}.mlab{display:block}.crow,.mrow{grid-template-columns:1fr;gap:6px}.cd b{display:inline;margin-right:8px}.mi{grid-template-columns:1fr}.fg2{grid-template-columns:1fr}}
@media(max-width:600px){.tabs a{padding:12px 8px;font-size:14px}.top .in{padding-top:18px}}
@media(prefers-reduced-motion:no-preference){.toast{transition:opacity .2s}}
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <div><a class="home" href="./">← Trang chủ</a><h1>Kế hoạch nhà mình</h1><p class="who" id="who"></p></div>
    <nav class="tabs" id="tabs" aria-label="Các mục">
      <a href="#today" data-v="today">Hôm nay</a>
      <a href="#train" data-v="train">Tập luyện</a>
      <a href="#cal" data-v="cal">Lịch chung</a>
      <a href="#chores" data-v="chores">Việc nhà</a>
      <a href="#meals" data-v="meals">Bữa ăn</a>
    </nav>
  </div>
  <div class="lanes" aria-hidden="true"><i></i><i></i></div>
</header>
<main class="in" id="main"><p class="load">Đang tải…</p></main>
<footer class="in foot" id="foot" hidden><span>Sao lưu dữ liệu:</span><button class="btn sm ghost" data-act="export">Xuất ra file</button><button class="btn sm ghost" data-act="import">Nhập từ file</button><input type="file" id="impf" accept="application/json,.json" hidden><span class="sp"></span><span>Dữ liệu lưu trên Firebase, chỉ tài khoản được cấp quyền mới xem được.</span></footer>
<div class="modal" id="modal" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt"></h3><form id="mf"></form></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="firebase-config.js"></script>
<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SP={run:{l:'Chạy',c:'#c63f1f'},swim:{l:'Bơi',c:'#1f6fd1'},yoga:{l:'Yoga',c:'#2b8a57'},str:{l:'Bổ trợ',c:'#b87400'},rest:{l:'Nghỉ',c:'#7b828c'}};
const SLOTS=['hieu','vo'];
const HAB={hieu:[['sleep','Ngủ trước 23h'],['water','Uống 2,5 lít nước'],['protein','Ăn đủ đạm, thêm bữa phụ'],['stretch','Giãn cơ 10 phút']],vo:[['sleep','Ngủ trước 23h'],['water','Uống 2 lít nước'],['stretch','Giãn cơ hoặc thiền 10 phút'],['steps','Đi bộ 7.000 bước']]};
const DOW=['T2','T3','T4','T5','T6','T7','CN'],DOWF=['Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7','Chủ nhật'];
const MEAL=[['s','Sáng'],['t','Trưa'],['c','Tối']];
const GUIDE='lich-tap-chay-lai.html';
const FBV='10.12.2',FB='https://www.gstatic.com/firebasejs/'+FBV+'/';
const COLS=[['people','people'],['workouts','wo'],['events','ev'],['chores','ch'],['meals','meals'],['habits','hab']];
const VIEWS=['today','train','cal','chores','meals'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const dow=s=>(parse(s).getDay()+6)%7;
const monday=s=>addD(s,-dow(s));
const fmt=s=>{const d=parse(s);return d.getDate()+'/'+(d.getMonth()+1)};
const TODAY=iso(new Date());
const weekDays=()=>[...Array(7)].map((_,i)=>addD(S.week,i));
const nkm=k=>String(Math.round(k*10)/10).replace('.',',');

const S={db:null,fb:null,me:null,people:{},wo:{},ev:{},ch:{},meals:{},hab:{},ready:false,stale:false,ro:false,off:false,signin:false,denied:false,pend:false,view:VIEWS.includes(location.hash.slice(1))?location.hash.slice(1):'today',week:monday(TODAY),filter:'both'};

const label=w=>{const p=S.people[w];return (p&&typeof p.label==='string'&&p.label.trim())||(w==='hieu'?'Hiếu':'Vợ')};
const role=()=>{const id=S.me&&S.me.id;return id?SLOTS.find(w=>S.people[w]&&S.people[w].uid===id)||null:null};
const canW=()=>!!S.db&&!!S.me&&!S.ro&&!S.denied;
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2800)};

const Q={};
function w8(path,fn){
  const p=(Q[path]||Promise.resolve()).then(fn).catch(e=>{
    const c=e&&e.code;
    if(c==='permission-denied'){S.ro=true;toast('Tài khoản này chưa có quyền lưu');render()}
    else if(c==='resource-exhausted')toast('Đã hết hạn mức miễn phí hôm nay của Firebase');
    else toast('Chưa lưu được, thử lại sau');
  });
  Q[path]=p;return p;
}
const setD=(path,data)=>w8(path,()=>S.db.doc(path).set(data));
const delD=path=>w8(path,()=>S.db.doc(path).delete());
const newPath=col=>S.db.collection(col).doc().path;

const list=(col,f)=>Object.entries(S[col]).map(([id,x])=>({id,...x})).filter(f);
const wosOn=(w,d)=>list('wo',x=>x.who===w&&x.date===d).sort((a,b)=>(a.sport==='rest')-(b.sport==='rest')||String(a.title).localeCompare(String(b.title)));
const evOn=d=>list('ev',x=>x.date===d).sort((a,b)=>String(a.time||'').localeCompare(String(b.time||'')));
const chOn=d=>list('ch',x=>Array.isArray(x.days)&&x.days.includes(dow(d))).sort((a,b)=>String(a.title).localeCompare(String(b.title)));
const whoChip=w=>w==='hieu'||w==='vo'?`<span class="chip pc l-${w}">${esc(label(w))}</span>`:'<span class="chip both">Cả hai</span>';
const verdict=h=>{if(h.hr==null||h.hr===''||h.hrv==null||h.hrv==='')return['na','Nhập hai số trên Garmin sau khi thức dậy'];return(+h.hr<=73&&+h.hrv>=29)?['ok','Đạt. Tập theo lịch hôm nay.']:['no','Chưa đạt. Hôm nay chỉ đi bộ và giãn cơ.']};

function woCard(x,compact){
  const sp=SP[x.sport]||SP.rest;
  const meta=[x.km?nkm(+x.km)+' km':'',x.min?x.min+' phút':''].filter(Boolean).join(', ');
  const det=x.detail?(compact?`<details class="det"><summary>Chi tiết</summary>${esc(x.detail)}</details>`:`<p class="det">${esc(x.detail)}</p>`):'';
  const guide=x.sport==='str'&&x.who==='hieu'?`<a class="lnk" href="${GUIDE}" target="_blank" rel="noopener">Xem hình minh họa bài tập</a>`:'';
  const acts=canW()&&x.sport!=='rest'?`<button class="btn sm ghost${x.done?' on':''}" data-act="done-wo" data-id="${esc(x.id)}" aria-pressed="${!!x.done}">${x.done?'Đã xong':'Đánh dấu xong'}</button>`:(x.done?'<span class="meta">Đã xong</span>':'');
  return `<div class="wo${x.done?' done':''}" style="--sc:${sp.c}"><div class="wt"><span class="chip">${sp.l}</span>${meta?`<span class="meta">${esc(meta)}</span>`:''}</div><h4>${esc(x.title)}</h4>${det}${guide}<div class="wa">${acts}${canW()?`<button class="btn sm ghost" data-act="edit-wo" data-id="${esc(x.id)}">Sửa</button>`:''}</div></div>`;
}

function habits(w,d){
  const h=S.hab[w+'_'+d]||{},it=(h.items&&typeof h.items==='object')?h.items:{},ed=canW()&&role()===w;
  const rows=HAB[w].map(([k,l])=>`<label class="hb"><input type="checkbox" data-ch="hab" data-who="${w}" data-date="${d}" data-k="${k}"${it[k]?' checked':''}${ed?'':' disabled'}><span>${l}</span></label>`).join('');
  let mc='';
  if(w==='hieu'){const v=verdict(h);mc=`<div class="mc"><label>Nhịp tim khi ngủ<input type="number" inputmode="numeric" data-hm="hr" data-who="${w}" data-date="${d}" value="${esc(h.hr??'')}"${ed?'':' disabled'}></label><label>HRV (ms)<input type="number" inputmode="numeric" data-hm="hrv" data-who="${w}" data-date="${d}" value="${esc(h.hrv??'')}"${ed?'':' disabled'}></label><p class="vd ${v[0]}">${v[1]}</p></div>`}
  const n=HAB[w].filter(([k])=>it[k]).length;
  return `<div class="habs"><h5>Thói quen hôm nay <span>${n}/${HAB[w].length}</span></h5>${mc}${rows}</div>`;
}

function lane(w,d){
  const l=wosOn(w,d),mine=role()===w;
  return `<article class="lane l-${w}"><header><span class="pdot"></span><h3>${esc(label(w))}${mine?' <small>(bạn)</small>':''}</h3></header>${l.length?l.map(x=>woCard(x,false)).join(''):'<p class="none">Hôm nay không có bài tập.</p>'}${canW()?`<div><button class="btn sm ghost" data-act="add-wo" data-who="${w}" data-date="${d}">Thêm bài tập</button></div>`:''}${habits(w,d)}</article>`;
}

function vToday(){
  const d=TODAY,ev=evOn(d),ch=chOn(d),m=S.meals[d]||{};
  const inv=role()==='hieu'&&!(S.people.vo&&S.people.vo.uid)?'<p class="warn">Vợ bạn chưa vào trang. Thêm email Google của cô ấy vào Firestore rules, gửi link trang này, cô ấy đăng nhập Google và bấm "Tôi là vợ của Hiếu" là xong.</p>':'';
  return `${inv}<p class="kick">Hôm nay</p><h2>${DOWF[dow(d)]}, ${fmt(d)}</h2><div class="duo">${(role()==='vo'?['vo','hieu']:SLOTS).map(w=>lane(w,d)).join('')}</div>
  <div class="tri">
    <section class="box"><h3>Lịch chung${canW()?`<button class="btn sm ghost" data-act="add-ev" data-date="${d}">Thêm</button>`:''}</h3>${ev.length?ev.map(x=>`<div class="row"><span class="tm">${esc(x.time||'Cả ngày')}</span><span class="tt">${esc(x.title)}</span>${whoChip(x.who)}</div>`).join(''):'<p class="none">Không có lịch hôm nay.</p>'}</section>
    <section class="box"><h3>Việc nhà</h3>${ch.length?ch.map(x=>chRow(x,d)).join(''):'<p class="none">Không có việc hôm nay.</p>'}</section>
    <section class="box"><h3>Bữa ăn<a class="btn sm ghost" href="#meals" style="display:inline-grid;place-items:center;text-decoration:none">Sửa</a></h3>${MEAL.map(([k,l])=>`<div class="row"><span class="tm">${l}</span><span class="tt">${esc(m[k]||'Chưa có')}</span></div>`).join('')}</section>
  </div>`;
}

function weekNav(){
  const cur=monday(TODAY);
  return `<div class="wk"><button class="btn sm ghost" data-act="wk" data-d="-7" aria-label="Tuần trước">‹</button><h2>${fmt(S.week)} – ${fmt(addD(S.week,6))}</h2><button class="btn sm ghost" data-act="wk" data-d="7" aria-label="Tuần sau">›</button>${S.week!==cur?'<button class="btn sm ghost" data-act="wk" data-d="0">Tuần này</button>':''}</div>`;
}
const defDate=()=>{const d=weekDays();return d.includes(TODAY)?TODAY:d[0]};

function vTrain(){
  const days=weekDays(),ws=S.filter==='both'?SLOTS:[S.filter];
  const sums=ws.map(w=>{const l=days.flatMap(d=>wosOn(w,d)).filter(x=>x.sport!=='rest');const km=l.filter(x=>x.sport==='run').reduce((a,x)=>a+(+x.km||0),0);const dn=l.filter(x=>x.done).length;return `<div class="sm l-${w}"><span class="pdot"></span><b>${esc(label(w))}</b><span>${km?nkm(km)+' km chạy, ':''}${dn}/${l.length} buổi xong</span></div>`}).join('');
  const head=ws.length>1?`<div class="gh"></div>${ws.map(w=>`<div class="gh l-${w}"><span class="pdot"></span>${esc(label(w))}</div>`).join('')}`:'';
  const rows=days.map(d=>`<div class="gd${d===TODAY?' today':''}"><b>${DOW[dow(d)]}</b><span>${fmt(d)}</span></div>${ws.map(w=>{const l=wosOn(w,d);return `<div class="gc l-${w}"><span class="mlab">${esc(label(w))}</span>${l.map(x=>woCard(x,true)).join('')||'<span class="none">Trống</span>'}</div>`}).join('')}`).join('');
  return `${weekNav()}<div class="tools"><div class="seg" role="group" aria-label="Xem lịch của">${[['both','Cả hai'],['hieu',label('hieu')],['vo',label('vo')]].map(([k,l])=>`<button data-act="filter" data-f="${k}" aria-pressed="${S.filter===k}">${esc(l)}</button>`).join('')}</div>${canW()?`<button class="btn" data-act="add-wo" data-who="${role()||'hieu'}" data-date="${defDate()}">Thêm bài tập</button>`:''}</div><div class="sums">${sums}</div><div class="wgrid c${ws.length}">${head}${rows}</div><p class="note">Bấm "Chi tiết" để xem cách tập, "Sửa" để đổi ngày hoặc nội dung. Lịch của ${esc(label('vo'))} hiện là lịch mẫu, sửa lại cho vừa sức.</p>`;
}

function vCal(){
  const rows=weekDays().map(d=>{const l=evOn(d);return `<div class="crow${d===TODAY?' today':''}"><div class="cd"><b>${DOWF[dow(d)]}</b><span>${fmt(d)}</span></div><div class="cl">${l.map(x=>`<button class="ev" data-act="edit-ev" data-id="${esc(x.id)}"${canW()?'':' disabled'}><span class="tm">${esc(x.time||'Cả ngày')}</span><span class="tt">${esc(x.title)}</span>${whoChip(x.who)}</button>`).join('')||'<span class="none">Không có lịch</span>'}</div></div>`}).join('');
  return `${weekNav()}<div class="tools"><p class="kick">Hẹn hò, việc gia đình, sinh nhật, lịch khám…</p>${canW()?`<button class="btn" data-act="add-ev" data-date="${defDate()}">Thêm lịch</button>`:''}</div>${rows}`;
}

function chRow(x,d){
  const done=!!(x.done&&x.done[d]);
  return `<label class="ch${done?' done':''}"><input type="checkbox" data-ch="chore" data-id="${esc(x.id)}" data-date="${d}"${done?' checked':''}${canW()?'':' disabled'}><span class="tt">${esc(x.title)}</span>${whoChip(x.who)}</label>`;
}
function vChores(){
  const days=weekDays(),cnt={hieu:0,vo:0,both:0};
  days.forEach(d=>chOn(d).forEach(x=>{cnt[x.who==='hieu'||x.who==='vo'?x.who:'both']++}));
  const rows=days.map(d=>{const l=chOn(d);return `<div class="crow${d===TODAY?' today':''}"><div class="cd"><b>${DOWF[dow(d)]}</b><span>${fmt(d)}</span></div><div class="cl">${l.map(x=>chRow(x,d)).join('')||'<span class="none">Không có việc</span>'}</div></div>`}).join('');
  const all=list('ch',()=>true).sort((a,b)=>String(a.title).localeCompare(String(b.title)));
  const mgr=`<h3 style="margin-top:32px">Danh sách việc</h3><div class="list">${all.map(x=>`<button class="ev" data-act="edit-ch" data-id="${esc(x.id)}"${canW()?'':' disabled'}><span class="tt">${esc(x.title)}</span><span class="meta">${(Array.isArray(x.days)?x.days:[]).slice().sort().map(i=>DOW[i]).join(', ')}</span>${whoChip(x.who)}</button>`).join('')||'<p class="none">Chưa có việc nào.</p>'}</div>`;
  return `${weekNav()}<div class="tools"><div class="sums" style="margin:0">${['hieu','vo'].map(w=>`<div class="sm l-${w}"><span class="pdot"></span><b>${esc(label(w))}</b><span>${cnt[w]} lượt</span></div>`).join('')}<div class="sm"><b>Cả hai</b><span>${cnt.both} lượt</span></div></div>${canW()?'<button class="btn" data-act="add-ch">Thêm việc</button>':''}</div>${rows}${mgr}<p class="note">Danh sách ban đầu là mẫu, mọi việc đang để "Cả hai". Bấm vào từng việc để chia người làm và chọn ngày.</p>`;
}

function vMeals(){
  const rows=weekDays().map(d=>{const m=S.meals[d]||{};return `<div class="mrow${d===TODAY?' today':''}"><div class="cd"><b>${DOWF[dow(d)]}</b><span>${fmt(d)}</span></div><div class="mi">${MEAL.map(([k,l])=>`<label class="f"><span>${l}</span><input data-meal="${d}" data-k="${k}" value="${esc(m[k]||'')}" placeholder="Chưa có" maxlength="120"${canW()?'':' disabled'}></label>`).join('')}</div></div>`}).join('');
  return `${weekNav()}<p class="kick" style="margin-bottom:12px">Gõ món rồi bấm ra ngoài ô là lưu. Bữa nào cũng nên có đạm (thịt, cá, trứng, đậu, sữa). Ngày ${esc(label('hieu'))} chạy thì thêm một bữa phụ như chuối với sữa.</p>${rows}<p class="note">Thực đơn tuần này là gợi ý mẫu, sửa thoải mái.</p>`;
}

function claimBox(){
  const free=SLOTS.filter(w=>!(S.people[w]&&S.people[w].uid));
  if(!free.length)return '<p class="warn">Hai hồ sơ Hiếu và Vợ đều đã có người nhận. Bạn đang xem bằng tài khoản khác.</p>';
  return `<div class="claim"><h3>Chào bạn! Bạn là ai trong nhà?</h3><p>Nhận hồ sơ một lần để trang biết bài tập và thói quen nào là của bạn.</p><label class="f"><span>Tên hiển thị trên trang (để trống thì ghi Hiếu / Vợ)</span><input id="clab" maxlength="24" placeholder="Ví dụ: tên của bạn"></label><div class="wa">${free.map(w=>`<button class="btn" data-act="claim" data-slot="${w}">${w==='hieu'?'Tôi là Hiếu':'Tôi là vợ của Hiếu'}</button>`).join('')}</div></div>`;
}
function signinBox(){
  return `<div class="claim"><h3>Đăng nhập để xem kế hoạch</h3><p>Trang dùng tài khoản Google để biết ai đang xem và chỉ cho người trong nhà đọc, sửa dữ liệu.</p><div><button class="btn" data-act="signin">Đăng nhập bằng Google</button></div></div>`;
}

function render(){
  const a=document.activeElement;
  if(a&&$('main').contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=='checkbox'){S.pend=true;return}
  S.pend=false;
  document.querySelectorAll('#tabs a').forEach(x=>x.setAttribute('aria-current',x.dataset.v===S.view?'page':'false'));
  const r=role(),nm=S.me&&(S.me.name||S.me.email);
  $('who').innerHTML=S.me?`${r?`Đang đăng nhập: ${esc(nm||label(r))} (${esc(label(r))})`:`Đang xem: ${esc(nm||'bạn')}`}<button data-act="signout">Đăng xuất</button>`:'';
  $('foot').hidden=!(S.ready&&canW()&&!S.denied);
  const m=$('main');
  if(S.off){m.innerHTML=`<h2>Chưa kết nối được Firebase</h2><p>${esc(S.off===true?'Chưa điền cấu hình Firebase trong file firebase-config.js. Làm theo hướng dẫn trong README.md của repo.':S.off)}</p>`;return}
  if(S.signin){m.innerHTML=signinBox();return}
  if(S.denied){m.innerHTML=`<div class="claim"><h3>Tài khoản này chưa được cấp quyền</h3><p>${esc(S.me&&S.me.email||'Tài khoản này')} chưa có trong danh sách được xem. Nhờ Hiếu thêm email này vào Firestore rules, hoặc đăng xuất và đăng nhập bằng tài khoản khác.</p><div><button class="btn" data-act="signout">Đăng xuất</button></div></div>`;return}
  if(!S.ready&&!S.stale){m.innerHTML='<p class="load">Đang tải dữ liệu…</p>';return}
  let top='';
  if(S.stale&&!S.ready)top+='<p class="warn">Chưa kết nối được dữ liệu. Trang sẽ tự cập nhật khi có kết nối. Nếu đang dùng mạng công ty, thử bấm Ctrl+F5 hoặc mở bằng mạng khác (4G, wifi nhà).</p>';
  if(S.ro)top+='<p class="warn">Bạn đang ở chế độ chỉ xem. Nhờ Hiếu thêm email của bạn vào Firestore rules để lưu được.</p>';
  if(!r&&S.me&&S.me.id&&canW())top+=claimBox();
  if(S.ready&&canW()&&!Object.keys(S.wo).length&&!Object.keys(S.ch).length&&!Object.keys(S.meals).length)top+='<div class="warn"><p style="margin:0 0 10px">Chưa có dữ liệu. Bấm nút dưới đây và chọn file du_lieu_ban_dau.json (ở Desktop\\chay trên máy tính) để nạp lịch tập, việc nhà và thực đơn.</p><button class="btn sm" data-act="import">Nhập từ file</button></div>';
  m.innerHTML=top+({today:vToday,train:vTrain,cal:vCal,chores:vChores,meals:vMeals}[S.view])();
}

let MS=null,MD=null;
function modal(t,html,save,del){
  $('mt').textContent=t;
  $('mf').innerHTML=`<div class="fg2">${html}</div><div class="mb">${del?'<button type="button" class="btn ghost danger" data-act="m-del">Xoá</button>':''}<span class="sp"></span><button type="button" class="btn ghost" data-act="m-close">Huỷ</button><button type="submit" class="btn">Lưu</button></div>`;
  MS=save;MD=del;$('modal').hidden=false;
  const f=$('mf').querySelector('input,select,textarea');if(f)f.focus();
}
function closeM(){$('modal').hidden=true;MS=MD=null;if(S.pend)render()}
const whoSel=(v,both)=>`<select name="who">${both?`<option value="both"${v==='both'?' selected':''}>Cả hai</option>`:''}${SLOTS.map(w=>`<option value="${w}"${v===w?' selected':''}>${esc(label(w))}</option>`).join('')}</select>`;

function openWo(id,who,date){
  const x=id?S.wo[id]:{who:who||role()||'hieu',date:date||TODAY,sport:'run',title:'',detail:''};
  if(!x)return;
  modal(id?'Sửa bài tập':'Thêm bài tập',
  `<label class="f"><span>Người tập</span>${whoSel(x.who)}</label>
  <label class="f"><span>Ngày</span><input type="date" name="date" value="${esc(x.date)}" required></label>
  <label class="f"><span>Môn</span><select name="sport">${Object.entries(SP).map(([k,v])=>`<option value="${k}"${x.sport===k?' selected':''}>${v.l}</option>`).join('')}</select></label>
  <label class="f"><span>Thời lượng (phút)</span><input type="number" name="min" min="0" max="600" value="${esc(x.min??'')}"></label>
  <label class="f wide"><span>Tên bài</span><input name="title" value="${esc(x.title)}" required maxlength="80"></label>
  <label class="f"><span>Quãng đường (km)</span><input type="number" name="km" min="0" max="200" step="0.1" value="${esc(x.km??'')}"></label>
  <label class="f wide"><span>Chi tiết</span><textarea name="detail" maxlength="1500">${esc(x.detail||'')}</textarea></label>`,
  fd=>{const o={who:fd.get('who'),date:fd.get('date'),sport:fd.get('sport'),title:String(fd.get('title')).trim(),detail:String(fd.get('detail')).trim(),done:!!x.done};const mn=fd.get('min'),km=fd.get('km');if(mn)o.min=+mn;if(km)o.km=+km;setD(id?'workouts/'+id:newPath('workouts'),o);toast('Đã lưu bài tập')},
  id?()=>{delD('workouts/'+id);toast('Đã xoá bài tập')}:null);
}
function openEv(id,date){
  const x=id?S.ev[id]:{date:date||TODAY,time:'',title:'',who:'both'};
  if(!x)return;
  modal(id?'Sửa lịch':'Thêm lịch',
  `<label class="f wide"><span>Việc gì</span><input name="title" value="${esc(x.title)}" required maxlength="80"></label>
  <label class="f"><span>Ngày</span><input type="date" name="date" value="${esc(x.date)}" required></label>
  <label class="f"><span>Giờ (để trống nếu cả ngày)</span><input type="time" name="time" value="${esc(x.time||'')}"></label>
  <label class="f wide"><span>Của ai</span>${whoSel(x.who,true)}</label>`,
  fd=>{setD(id?'events/'+id:newPath('events'),{title:String(fd.get('title')).trim(),date:fd.get('date'),time:fd.get('time')||'',who:fd.get('who')});toast('Đã lưu lịch')},
  id?()=>{delD('events/'+id);toast('Đã xoá lịch')}:null);
}
function openCh(id){
  const x=id?S.ch[id]:{title:'',who:'both',days:[]};
  if(!x)return;
  const ds=Array.isArray(x.days)?x.days:[];
  modal(id?'Sửa việc nhà':'Thêm việc nhà',
  `<label class="f wide"><span>Việc gì</span><input name="title" value="${esc(x.title)}" required maxlength="60"></label>
  <label class="f wide"><span>Ai làm</span>${whoSel(x.who,true)}</label>
  <div class="f wide"><span>Những ngày nào</span><div class="days">${DOW.map((l,i)=>`<label><input type="checkbox" name="d" value="${i}"${ds.includes(i)?' checked':''}>${l}</label>`).join('')}</div></div>`,
  fd=>{const days=fd.getAll('d').map(Number);setD(id?'chores/'+id:newPath('chores'),{title:String(fd.get('title')).trim(),who:fd.get('who'),days,done:(x.done&&typeof x.done==='object')?x.done:{}});toast('Đã lưu việc nhà')},
  id?()=>{delD('chores/'+id);toast('Đã xoá việc')}:null);
}

async function claim(slot,lab){
  if(!S.me||!S.me.id){toast('Cần đăng nhập Google để nhận hồ sơ');return}
  if(!SLOTS.includes(slot))return;
  try{
    const r=await S.db.claim('people/'+slot,S.me.id,lab||(slot==='hieu'?'Hiếu':'Vợ'));
    toast(r?'Đã nhận hồ sơ. Chào mừng bạn!':'Hồ sơ này đã có người nhận');
  }catch(e){toast(e&&e.code==='permission-denied'?'Tài khoản này chưa có quyền lưu':'Chưa nhận được hồ sơ, thử lại sau')}
}

function exportData(){
  const o={};COLS.forEach(([c,k])=>{if(c!=='people')o[c]=S[k]});
  const b=new Blob([JSON.stringify(o,null,1)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='ke-hoach-nha-minh_'+TODAY+'.json';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
async function importData(file){
  let o;
  try{o=JSON.parse(await file.text())}catch(e){toast('File không đúng định dạng JSON');return}
  const ok=/^[A-Za-z0-9_-]{1,80}$/,ws=[];
  COLS.forEach(([c])=>{if(c==='people'||!o||typeof o[c]!=='object'||!o[c])return;Object.entries(o[c]).forEach(([id,d])=>{if(ok.test(id)&&d&&typeof d==='object'&&!Array.isArray(d))ws.push([c+'/'+id,d])})});
  if(!ws.length){toast('File không có dữ liệu để nhập');return}
  try{await S.db.batch(ws);toast('Đã nhập '+ws.length+' mục')}catch(e){toast(e&&e.code==='permission-denied'?'Tài khoản này chưa có quyền lưu':'Chưa nhập được, thử lại sau')}
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='wk'){const d=+b.dataset.d;S.week=d?addD(S.week,d):monday(TODAY);render()}
  else if(a==='filter'){S.filter=b.dataset.f;render()}
  else if(a==='add-wo')openWo(null,b.dataset.who,b.dataset.date);
  else if(a==='edit-wo')openWo(b.dataset.id);
  else if(a==='done-wo'){const id=b.dataset.id,x=S.wo[id];if(x)setD('workouts/'+id,{...x,done:!x.done})}
  else if(a==='add-ev')openEv(null,b.dataset.date);
  else if(a==='edit-ev')openEv(b.dataset.id);
  else if(a==='add-ch')openCh(null);
  else if(a==='edit-ch')openCh(b.dataset.id);
  else if(a==='claim'){const v=$('clab');claim(b.dataset.slot,v?v.value.trim().slice(0,24):'')}
  else if(a==='signin')S.fb&&S.fb.signin().catch(()=>toast('Chưa đăng nhập được, thử lại'));
  else if(a==='signout')S.fb&&S.fb.signout();
  else if(a==='export')exportData();
  else if(a==='import')$('impf').click();
  else if(a==='m-close')closeM();
  else if(a==='m-del'){if(b.dataset.sure){if(MD)MD();closeM()}else{b.dataset.sure='1';b.textContent='Bấm lần nữa để xoá'}}
});
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeM()});
$('impf').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(f&&canW())importData(f)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').hidden)closeM()});
$('mf').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData($('mf'));const f=MS;closeM();if(f)f(fd)});

document.addEventListener('change',e=>{
  const t=e.target;if(!canW())return;
  if(t.dataset.ch==='hab'){const p=t.dataset.who+'_'+t.dataset.date,h=S.hab[p]||{},it={...(h.items||{})};it[t.dataset.k]=t.checked;setD('habits/'+p,{...h,items:it})}
  else if(t.dataset.ch==='chore'){const x=S.ch[t.dataset.id];if(!x)return;const cut=addD(TODAY,-60),done={};Object.entries(x.done||{}).forEach(([k,v])=>{if(k>=cut&&v)done[k]=true});if(t.checked)done[t.dataset.date]=true;else delete done[t.dataset.date];setD('chores/'+t.dataset.id,{...x,done})}
  else if(t.dataset.hm){const p=t.dataset.who+'_'+t.dataset.date,h=S.hab[p]||{};const v=t.value===''?'':+t.value;if(h[t.dataset.hm]===v)return;setD('habits/'+p,{...h,items:h.items||{},[t.dataset.hm]:v})}
  else if(t.dataset.meal){const d=t.dataset.meal,m=S.meals[d]||{},v=t.value.trim();if((m[t.dataset.k]||'')===v)return;setD('meals/'+d,{...m,[t.dataset.k]:v})}
});
document.addEventListener('focusout',()=>{if(S.pend)setTimeout(()=>{if(S.pend)render()},0)});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS.includes(v)&&v!==S.view){S.view=v;render();window.scrollTo(0,0)}});

let loadT=null,UNSUB=[],GOT=new Set();
function fresh(){if(!S.ready){S.ready=true;clearTimeout(loadT)}}
function sub(col,key){
  return S.db.watch(col,snap=>{
    S[key]=snap.docs;
    if(!snap.fromCache){GOT.add(col);if(GOT.size>=COLS.length)fresh()}
    render();
  },e=>{
    if(e&&e.code==='permission-denied'){S.denied=true;stopSubs()}
    else{fresh();toast('Mất kết nối dữ liệu')}
    render();
  });
}
function stopSubs(){UNSUB.forEach(u=>{try{u()}catch(e){}});UNSUB=[];GOT=new Set();clearTimeout(loadT)}

/* Firebase: Google sign-in + Firestore, wrapped in the small db API the page uses. */
async function firebase(cfg){
  const [A,U,F]=await Promise.all([import(FB+'firebase-app.js'),import(FB+'firebase-auth.js'),import(FB+'firebase-firestore.js')]);
  const app=A.initializeApp(cfg),auth=U.getAuth(app);
  /* experimentalForceLongPolling: mạng công ty, proxy hay phần mềm diệt virus hay chặn kết nối streaming của Firestore
     (gọi lẻ như nhận hồ sơ vẫn chạy nhưng dữ liệu không về). Long polling chạy qua được các mạng đó, chậm hơn không đáng kể. */
  let fs;try{fs=F.initializeFirestore(app,{experimentalForceLongPolling:true,localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){fs=F.getFirestore(app)}
  const prov=new U.GoogleAuthProvider();prov.setCustomParameters({prompt:'select_account'});
  const db={
    doc:path=>({set:data=>F.setDoc(F.doc(fs,path),data),delete:()=>F.deleteDoc(F.doc(fs,path))}),
    collection:col=>({doc:()=>({path:F.doc(F.collection(fs,col)).path})}),
    watch:(col,next,err)=>F.onSnapshot(F.collection(fs,col),snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});next({docs:o,fromCache:snap.metadata.fromCache})},err),
    claim:(path,uid,label)=>F.runTransaction(fs,async t=>{const r=F.doc(fs,path),s=await t.get(r),cur=s.exists()?s.data():{};if(cur.uid&&cur.uid!==uid)return false;t.set(r,{...cur,uid,label:label||cur.label});return true}),
    batch:async ws=>{for(let i=0;i<ws.length;i+=400){const b=F.writeBatch(fs);ws.slice(i,i+400).forEach(([p,d])=>b.set(F.doc(fs,p),d));await b.commit()}}
  };
  return {db,
    signin:()=>U.signInWithPopup(auth,prov).catch(e=>{if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'))return U.signInWithRedirect(auth,prov);if(e&&e.code==='auth/popup-closed-by-user')return;throw e}),
    signout:()=>U.signOut(auth),
    onUser:fn=>U.onAuthStateChanged(auth,fn)};
}
async function boot(){
  render();
  const cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.apiKey||/DIEN_/.test(cfg.apiKey)){S.off=true;render();return}
  try{S.fb=await firebase(cfg)}catch(e){S.off='Không tải được thư viện Firebase. Kiểm tra mạng rồi tải lại trang.';render();return}
  S.db=S.fb.db;
  S.fb.onUser(u=>{
    stopSubs();
    S.people={};S.wo={};S.ev={};S.ch={};S.meals={};S.hab={};S.ready=S.stale=S.ro=S.denied=false;
    if(!u){S.me=null;S.signin=true;render();return}
    S.signin=false;S.me={id:u.uid,name:u.displayName||'',email:u.email||''};
    loadT=setTimeout(()=>{if(!S.ready){S.stale=true;render()}},10000);
    UNSUB=COLS.map(([c,k])=>sub(c,k));
    render();
  });
}
boot();
}
